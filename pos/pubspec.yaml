name: core_pos
description: CORE POS Android client.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/branding/core-logo.png
  adaptive_icon_background: "#3454D1"
  adaptive_icon_foreground: assets/branding/core-logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/core-logo.png
    - assets/branding/core-pdv-wordmark.png
