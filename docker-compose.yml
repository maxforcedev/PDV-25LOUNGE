name: corepdv-25lounge-dev

services:
  db:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corepdv}
      POSTGRES_USER: ${POSTGRES_USER:-corepdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corepdv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: development
      args:
        APP_VERSION: ${APP_VERSION:-development}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        ENVIRONMENT: ${ENVIRONMENT:-development}
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: 'True'
      SECRET_KEY: ${SECRET_KEY:-local-compose-key-change-before-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000},http://localhost:${PLATFORM_ADMIN_PORT:-3001},http://127.0.0.1:${PLATFORM_ADMIN_PORT:-3001}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000},http://localhost:${PLATFORM_ADMIN_PORT:-3001},http://127.0.0.1:${PLATFORM_ADMIN_PORT:-3001}
      TIME_ZONE: America/Sao_Paulo
      LANGUAGE_CODE: pt-br
      DATABASE_URL: postgresql://${POSTGRES_USER:-corepdv}@db:5432/${POSTGRES_DB:-corepdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corepdv}
      TRUST_PROXY_HEADERS: 'False'
      SECURE_SSL_REDIRECT: 'False'
      SESSION_COOKIE_SECURE: 'False'
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}
      SESSION_SAVE_EVERY_REQUEST: ${SESSION_SAVE_EVERY_REQUEST:-True}
      AXES_FAILURE_LIMIT: ${AXES_FAILURE_LIMIT:-5}
      AXES_COOLOFF_MINUTES: ${AXES_COOLOFF_MINUTES:-15}
      CSRF_COOKIE_SECURE: 'False'
      SECURE_HSTS_SECONDS: '0'
      MIGRATE_ON_START: 'True'
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      PRIVATE_MEDIA_ROOT: /app/private_media
      APP_VERSION: ${APP_VERSION:-development}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - '127.0.0.1:${BACKEND_PORT:-18000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-18000}/api/v1
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-development}
      NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
      NEXT_PUBLIC_BUILD_DATE: ${BUILD_DATE:-unknown}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-development}
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(response => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  platform-admin:
    build:
      context: ./platform-admin
      target: dependencies
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-18000}/api/v1
        NEXT_PUBLIC_BACKOFFICE_URL: http://localhost:${FRONTEND_PORT:-3000}
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-18000}/api/v1
      NEXT_PUBLIC_BACKOFFICE_URL: http://localhost:${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-development}
      NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
      NEXT_PUBLIC_BUILD_DATE: ${BUILD_DATE:-unknown}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-development}
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./platform-admin:/app
      - platform_admin_node_modules:/app/node_modules
      - platform_admin_next_cache:/app/.next
    ports:
      - '127.0.0.1:${PLATFORM_ADMIN_PORT:-3001}:3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/login', {signal: AbortSignal.timeout(4000)}).then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
  platform_admin_node_modules:
  platform_admin_next_cache:
