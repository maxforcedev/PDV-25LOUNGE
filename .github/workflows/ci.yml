name: CI

on:
  workflow_call:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: corepdv
          POSTGRES_USER: corepdv
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corepdv -d corepdv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-only-${{ github.run_id }}-${{ github.sha }}
      DATABASE_URL: postgresql://corepdv:ci-only-password@127.0.0.1:5432/corepdv
      ALLOWED_HOSTS: corepdv.com,api.corepdv.com,admin.corepdv.com,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://corepdv.com,https://admin.corepdv.com
      CORS_ALLOWED_ORIGINS: https://corepdv.com,https://admin.corepdv.com
      TRUST_PROXY_HEADERS: 'True'
      SECURE_SSL_REDIRECT: 'True'
      SESSION_COOKIE_SECURE: 'True'
      CSRF_COOKIE_SECURE: 'True'
      SECURE_HSTS_SECONDS: '300'
      SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
      SECURE_HSTS_PRELOAD: 'True'
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit Python dependencies
        run: python -m pip install --disable-pip-version-check pip-audit && python -m pip_audit -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: python manage.py test
      - name: Django deployment check
        run: python manage.py check --deploy --fail-level WARNING
      - name: Collect static files
        run: python manage.py collectstatic --noinput

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.corepdv.com/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build

  platform-admin:
    name: Platform Admin lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-admin
    env:
      NEXT_PUBLIC_API_URL: https://api.corepdv.com/api/v1
      NEXT_PUBLIC_BACKOFFICE_URL: https://corepdv.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint Platform Admin
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build Platform Admin
        run: npm run build

  containers:
    name: Production container builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - platform-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Docker definitions
        env:
          RELEASE_TAG: ${{ github.sha }}
        run: |
          docker compose config --quiet
          docker stack config --compose-file docker-stack.yml >/dev/null
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          target: production
          load: true
          push: false
          tags: core-pdv-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          target: production
          load: true
          push: false
          tags: core-pdv-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.corepdv.com/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build Platform Admin image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./platform-admin
          target: runner
          load: true
          push: false
          tags: core-pdv-platform-admin:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.corepdv.com/api/v1
            NEXT_PUBLIC_BACKOFFICE_URL=https://corepdv.com
          cache-from: type=gha,scope=platform-admin
          cache-to: type=gha,mode=max,scope=platform-admin
      - name: Verify production images
        shell: bash
        run: |
          set -euo pipefail

          for image in core-pdv-backend:ci core-pdv-frontend:ci core-pdv-platform-admin:ci; do
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            case "$user" in
              ''|0|root)
                echo "$image runs as root"
                exit 1
                ;;
            esac
          done

          backend_cmd="$(docker image inspect core-pdv-backend:ci --format '{{json .Config.Cmd}}')"
          frontend_cmd="$(docker image inspect core-pdv-frontend:ci --format '{{json .Config.Cmd}}')"
          platform_admin_cmd="$(docker image inspect core-pdv-platform-admin:ci --format '{{json .Config.Cmd}}')"
          [[ "$backend_cmd" == *gunicorn* ]]
          [[ "$frontend_cmd" == *server.js* ]]
          [[ "$platform_admin_cmd" == *server.js* ]]

          docker run --rm --entrypoint /bin/sh core-pdv-backend:ci -c \
            'test ! -e /app/.env && test ! -d /app/.venv && test -f /app/staticfiles/admin/css/base.css'
          docker run --rm --entrypoint /bin/sh core-pdv-frontend:ci -c \
            'test ! -e /app/.env && test ! -d /app/src && test -f /app/server.js'
          docker run --rm --entrypoint /bin/sh core-pdv-platform-admin:ci -c \
            'test ! -e /app/.env && test ! -d /app/src && test -f /app/server.js &&
             grep -R -F -q "https://api.corepdv.com/api/v1" /app/.next &&
             grep -R -F -q "https://corepdv.com" /app/.next &&
             ! grep -R -F -q "http://localhost" /app/.next &&
             ! grep -R -F -q "http://127.0.0.1" /app/.next'
