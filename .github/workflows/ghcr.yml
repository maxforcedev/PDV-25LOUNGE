name: Publish production images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs:
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/maxforcedev/core-pdv-backend
            cache_scope: backend
            build_args: ''
          - component: frontend
            context: ./frontend
            image: ghcr.io/maxforcedev/core-pdv-frontend
            cache_scope: frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.corepdv.com/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - name: Check immutable release tag
        id: release
        shell: bash
        run: |
          set +e
          inspect_output="$(docker buildx imagetools inspect "${{ matrix.image }}:${GITHUB_SHA}" 2>&1)"
          inspect_status=$?
          set -e

          if [ "$inspect_status" -eq 0 ]; then
            echo 'exists=true' >>"$GITHUB_OUTPUT"
            echo 'The SHA tag already exists and will not be overwritten.'
          elif grep -Eqi 'manifest unknown|name unknown|not found' <<<"$inspect_output"; then
            echo 'exists=false' >>"$GITHUB_OUTPUT"
          else
            echo "$inspect_output" >&2
            echo 'Could not determine whether the immutable SHA tag exists.' >&2
            exit "$inspect_status"
          fi
      - name: Build and publish
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
